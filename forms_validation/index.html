<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верстка и валидация форм</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Регистрация пользователя</h1>
            <p>Заполните форму ниже для создания аккаунта</p>
        </header>
        <main class="main">
            <form class="registration-form" id="registrationForm" novalidate>
                
                <!-- Личная информация -->
                <fieldset class="form-section">
                    <legend>Личная информация</legend>
                    <div class="form-group">
                        <label for="firstName" class="required">Имя</label>
                        <input type="text" id="firstName" name="firstName" required
                               minlength="2" maxlength="50" autocomplete="given-name"
                               placeholder="Введите ваше имя"
                               aria-describedby="firstNameError">
                        <span class="error-message" id="firstNameError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="lastName" class="required">Фамилия</label>
                        <input type="text" id="lastName" name="lastName" required
                               minlength="2" maxlength="50" autocomplete="family-name"
                               placeholder="Введите вашу фамилию"
                               aria-describedby="lastNameError">
                        <span class="error-message" id="lastNameError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        <input type="email" id="email" name="email" required
                               autocomplete="email" placeholder="example@mail.com"
                               aria-describedby="emailError">
                        <span class="error-message" id="emailError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel"
                               pattern="\+?[0-9\s\-\(\)]{10,18}"
                               placeholder="+7 (999) 999-99-99"
                               aria-describedby="phoneError">
                        <span class="error-message" id="phoneError" role="alert"></span>
                    </div>
                </fieldset>

                <!-- Безопасность -->
                <fieldset class="form-section">
                    <legend>Безопасность</legend>
                    <div class="form-group">
                        <label for="password" class="required">Пароль</label>
                        <input type="password" id="password" name="password" required
                               minlength="8" autocomplete="new-password"
                               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)\S+"
                               placeholder="Не менее 8 символов"
                               aria-describedby="passwordHint passwordError">
                        <div class="password-requirements" id="passwordHint">
                            Пароль должен содержать: заглавные и строчные буквы, цифры
                        </div>
                        <span class="error-message" id="passwordError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="required">Подтверждение пароля</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                               autocomplete="new-password" placeholder="Повторите пароль"
                               aria-describedby="confirmPasswordError">
                        <span class="error-message" id="confirmPasswordError" role="alert"></span>
                    </div>
                </fieldset>

                <!-- Дополнительная информация -->
                <fieldset class="form-section">
                    <legend>Дополнительная информация</legend>
                    <div class="form-group">
                        <label for="birthDate">Дата рождения</label>
                        <input type="date" id="birthDate" name="birthDate" autocomplete="bday"
                               min="1900-01-01" aria-describedby="birthDateError">
                        <span class="error-message" id="birthDateError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="country">Страна</label>
                        <select id="country" name="country">
                            <option value="">Выберите страну</option>
                            <option value="ru">Россия</option>
                            <option value="kz">Казахстан</option>
                            <option value="by">Беларусь</option>
                            <option value="other">Другая</option>
                        </select>
                    </div>
                    <fieldset class="form-group choice-fieldset">
                        <legend>Пол</legend>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="gender" value="male">
                                <span class="radio-custom"></span>
                                Мужской
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="female">
                                <span class="radio-custom"></span>
                                Женский
                            </label>
                        </div>
                    </fieldset>
                    <fieldset class="form-group choice-fieldset">
                        <legend>Интересы</legend>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="programming">
                                <span class="checkbox-custom"></span>
                                Программирование
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="design">
                                <span class="checkbox-custom"></span>
                                Дизайн
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="marketing">
                                <span class="checkbox-custom"></span>
                                Маркетинг
                            </label>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <label for="bio">О себе</label>
                        <textarea id="bio" name="bio" rows="4" maxlength="500"
                                  placeholder="Расскажите немного о себе..."
                                  aria-describedby="bioCounter"></textarea>
                        <div class="char-counter" id="bioCounter"><span id="charCount">0</span>/500 символов</div>
                    </div>
                </fieldset>

                <!-- Соглашения и кнопки -->
                <div class="form-section agreements">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required
                                   aria-describedby="termsError">
                            <span class="checkbox-custom"></span>
                            <span>Я принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a></span>
                        </label>
                        <span class="error-message" id="termsError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <span class="checkbox-custom"></span>
                            Я хочу получать новостную рассылку
                        </label>
                    </div>
                    <div class="form-status" id="formStatus" role="status" tabindex="-1"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                        <button type="reset" class="btn btn-secondary">Очистить форму</button>
                    </div>
                </div>
            </form>
        </main>
        
        <footer class="footer">
            <p>&copy; 2026 Формы и валидация</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
